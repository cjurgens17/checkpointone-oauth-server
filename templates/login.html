{% extends "base.html" %}

{% block body_class %}auth-background{% endblock %}

{% block content %}
  <div class="auth-card">
    <img class="auth-logo" src="{{ tenant.logo_url or url_for('static', filename='assets/checkpointone_logo.svg') }}" alt="{{ tenant.slug }}">

    <h1 class="auth-heading">Log In</h1>
    <p class="auth-subheading">to continue to <strong>{{ application.name }}</strong></p>

    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('authorize.authorize') }}">
      <input type="hidden" name="response_type" value="{{ response_type or '' }}">
      <input type="hidden" name="client_id" value="{{ client_id or '' }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri or '' }}">
      <input type="hidden" name="scope" value="{{ scope or '' }}">
      <input type="hidden" name="state" value="{{ state or '' }}">
      <input type="hidden" name="connection" value="{{ connection or '' }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}">
      <input type="hidden" name="audience" value="{{ audience or '' }}">
      <input type="hidden" name="screen_hint" value="login">

      <label class="auth-label" for="username">Username or email address</label>
      <input class="auth-input" type="text" id="username" name="username" value="{{ username or '' }}" required>

      <label class="auth-label" for="password">Password</label>
      <div class="auth-password-wrap">
        <input class="auth-input" type="password" id="password" name="password" required>
        <button class="auth-password-toggle" type="button" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <path d="M1 1l22 22"/>
          </svg>
        </button>
      </div>

      <button class="auth-submit" type="submit">Continue</button>
    </form>

    <a class="auth-link" href="{{ url_for('authorize.authorize', response_type=response_type, client_id=client_id, redirect_uri=redirect_uri, scope=scope, state=state, connection=connection, code_challenge=code_challenge, code_challenge_method=code_challenge_method, audience=audience, screen_hint='signup') }}">Don't have an account? Sign up</a>
    <a class="auth-link" href="#">Forgot password?</a>
  </div>

  <script>
    (function () {
      document.querySelectorAll(".auth-password-wrap").forEach((wrap) => {
        const toggle = wrap.querySelector(".auth-password-toggle");
        const input = wrap.querySelector(".auth-input");
        if (!toggle || !input) return;

        toggle.addEventListener("click", () => {
          const isMasked = input.type === "password";
          input.type = isMasked ? "text" : "password";
          toggle.classList.toggle("is-visible", isMasked);
          toggle.setAttribute("aria-pressed", String(isMasked));
          toggle.setAttribute("aria-label", isMasked ? "Hide password" : "Show password");
        });
      });
    })();
  </script>
{% endblock %}
