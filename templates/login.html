{% extends "base.html" %}

{% block content %}
  <div class="auth-card">
    <img class="auth-logo" src="{{ tenant.logo_url or url_for('static', filename='assets/checkpointone-dragon.svg') }}" alt="{{ tenant.slug }}">

    <h1 class="auth-heading">Log In</h1>
    <p class="auth-subheading">to continue to <strong>{{ application.name }}</strong></p>

    <form class="auth-form" method="post" action="{{ url_for('authorize.authorize') }}">
      <input type="hidden" name="response_type" value="{{ response_type or '' }}">
      <input type="hidden" name="client_id" value="{{ client_id or '' }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri or '' }}">
      <input type="hidden" name="scope" value="{{ scope or '' }}">
      <input type="hidden" name="state" value="{{ state or '' }}">
      <input type="hidden" name="connection" value="{{ connection or '' }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}">

      <label class="auth-label" for="username">Username or email address</label>
      <input class="auth-input" type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" required>

      <button class="auth-submit" type="submit">Continue</button>
    </form>

    <a class="auth-link" href="#">Forgot password?</a>
  </div>
{% endblock %}
