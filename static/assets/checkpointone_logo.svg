    <rect x="56" y="102" width="88" height="60" fill="#173a8a"/>
  </g>
  <path d="M100 32 L144 49 L144 100 Q144 140 100 160 Q56 140 56 100 L56 49 Z" fill="none" stroke="#0e2a63" stroke-width="2"/>

  <path d="M78 100 L94 118 L124 82" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
