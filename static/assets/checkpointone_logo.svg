<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CheckPointOne shield logo">
  <title>CheckPointOne logo</title>
  <desc>A navy rounded-square badge with a blue shield emblem and white checkmark, representing an OAuth checkpoint/authentication service.</desc>

  <rect width="200" height="200" rx="24" fill="#0e2a63"/>

  <circle cx="100" cy="98" r="78" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.18"/>

  <defs>
    <clipPath id="shieldClip">
