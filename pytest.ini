[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -rf
    --strict-markers
    --strict-config

markers =
    integration: exercises a live PostgreSQL database (the repo layer). Skipped automatically when no test database is reachable.

filterwarnings =
    ignore::DeprecationWarning
